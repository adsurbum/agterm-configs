# agterm keymap — a kitty-flavored config for rebinding built-in shortcuts and defining
# custom shell commands. Edit this file and run File ▸ Reload Keymap (or `agtermctl keymap
# reload`) to apply. Blank lines and lines starting with `#` are ignored.
#
# Two verbs:
#
#   map <chord> <action>
#       Rebind a built-in action to a single chord (no leader sequences for built-ins).
#       Chords use kitty syntax: mods joined by `+`, e.g. `cmd+shift+d`, `ctrl+\``.
#       Mods: ctrl, cmd, opt, shift. A Shift-typed symbol is shift+<base key>
#       (shift+/ for ?, shift+= for +, shift+5 for %). Example:
#
#           map cmd+shift+d  toggle_split
#
#   command "<name>" [chord] <shell...>
#       Define a custom command, shown in the action palette marked `custom`. The quoted
#       name may contain spaces. An optional chord (single chord OR a leader like `ctrl+a>g`)
#       binds it to a key; the chord MUST include a modifier (a bare key is rejected and the
#       line becomes palette-only). Omit the chord for a palette-only command. The rest of the
#       line is run via `/bin/sh -c`, detached with no terminal — so it suits fire-and-forget
#       launches (GUI apps, scripts), NOT a bare interactive or full-screen TUI program, which
#       has no TTY and exits at once. Launch a TUI over a session through an overlay terminal,
#       as the Lazygit example does. Examples:
#
#           command "Open in Zed"  cmd+shift+e  open -a Zed "$AGT_SESSION_PWD"
#           command "Lazygit"      ctrl+a>g     agtermctl session overlay open lazygit --socket "$AGT_SOCKET"
#           command "Deploy"                    ./deploy.sh
#
# Built-in actions (raw name → shipped default chord):
#
#   new_window                  cmd+opt+n
#   rename_window               (no default)
#   delete_window               (no default)
#   new_workspace               cmd+shift+n
#   rename_workspace            (no default)
#   delete_workspace            (no default)
#   new_session                 cmd+n
#   open_directory              cmd+o
#   rename_session              (no default)
#   close_session               cmd+w
#   reopen_recent               cmd+shift+t
#   undo_close                  cmd+z
#   clear_status                (no default)
#   increase_font_size          (not expressible)
#   decrease_font_size          cmd+-
#   reset_font_size             cmd+0
#   toggle_split                cmd+d
#   toggle_scratch              cmd+j
#   toggle_terminal_zoom        cmd+shift+return
#   toggle_search               cmd+f
#   toggle_sidebar              ctrl+cmd+s
#   select_theme                (no default)
#   toggle_fullscreen           ctrl+cmd+f
#   toggle_flagged_view         (no default)
#   toggle_flag                 cmd+shift+f
#   focus_workspace             (no default)
#   focus_left_pane             (no default)
#   focus_right_pane            (no default)
#   previous_session            (no default)
#   next_session                (no default)
#   previous_attention_session  (no default)
#   next_attention_session      (no default)
#   first_session               (no default)
#   last_session                (no default)
#   quick_terminal              ctrl+`
#   session_palette             ctrl+p
#   command_palette             ctrl+shift+p
#   custom_command_palette      ctrl+shift+o
#   show_attention              ctrl+shift+i
#   dashboard                   cmd+shift+d
#
# Custom-command tokens (expanded in the shell line and exported as $AGT_X env vars):
#
#   {AGT_SESSION_ID}
#   {AGT_SESSION_NAME}
#   {AGT_SESSION_PWD}
#   {AGT_WORKSPACE_ID}
#   {AGT_WORKSPACE_NAME}
#   {AGT_WINDOW_ID}
#   {AGT_WINDOW_NAME}
#   {AGT_PANE}
#   {AGT_SELECTION}
#   {AGT_SOCKET}
#
# NOTE: a {AGT_X} token is substituted RAW into the /bin/sh line — convenient, but unsafe for
# content you don't control. {AGT_SELECTION} is the obvious case, but a remote host can also set
# the session title (OSC) and the working directory (OSC 7), so {AGT_SESSION_NAME} and
# {AGT_SESSION_PWD} are equally unsafe raw. For any such content prefer the matching $AGT_X
# environment variable, QUOTED, e.g. "$AGT_SELECTION".
#
# Uncomment and edit a line below to start.
# map cmd+shift+d toggle_split

map cmd+p session_palette
map cmd+r rename_session
# ⌘⇧] / ⌘⇧[ (⌘}/⌘{) — next/prev session только по ОТКРЫТЫМ секциям сайдбара:
# сессии свёрнутых воркспейсов пропускаются (встроенные next/previous_session
# обходят все). Русские дубли ниже (cmd+shift+ъ/х) используют тот же скрипт.
command "Next open session" cmd+shift+] "$HOME/.config/agterm/scripts/go-open.sh" next
command "Prev open session" cmd+shift+[ "$HOME/.config/agterm/scripts/go-open.sh" prev
# ⌘] — фокус на правую панель, открыв сплит если его нет: см. custom command ниже
map cmd+[ focus_left_pane
map cmd+' toggle_scratch
# ⌘\ — фокус на левую панель, затем toggle сплита (см. custom command ниже)
map cmd+/ quick_terminal

# ⌘N — новая сессия в текущей директории активной сессии, СРАЗУ ПОД ней
# (--after; без него session new добавляет в конец workspace). Встроенный
# new_session, который всегда открывает $HOME, сдвинут на ⌘⌥⇧N.
map cmd+opt+shift+n new_session
command "New session here" cmd+n /opt/homebrew/bin/agtermctl session new --cwd "$AGT_SESSION_PWD" --after "$AGT_SESSION_ID" --socket "$AGT_SOCKET"

# ⌘B — новый таб в той же директории с форком Claude-сессии текущей панели
command "Fork Claude here" cmd+b "$HOME/.config/agterm/scripts/fork-claude.sh"

# ⌘D — новый таб в той же директории со СВЕЖИМ claude (⌘B форкает текущую
# беседу, ⌘N даёт просто шелл). Дефолтный ⌘D (toggle_split) свободен: сплит
# перевешен на ⌘\, а `\` одинаков в обеих раскладках.
command "New Claude here" cmd+d "$HOME/.config/agterm/scripts/new-claude.sh"

# ⌘T — переключить тему: Solarized Dark Higher Contrast ↔ iTerm2 Solarized Light
command "Toggle theme"     cmd+t  "$HOME/.config/agterm/scripts/toggle-theme.sh"
# кириллический дубль (Russian–PC: t → е)
command "Toggle theme (ru)" cmd+е "$HOME/.config/agterm/scripts/toggle-theme.sh"

# ⌘⇧O — открыть выделенный путь/URL через `open` (agterm по клику не открывает
# локальные файлы: голый путь не ссылка, а file:// он только показывает в Finder)
command "Open selection"   cmd+shift+o  "$HOME/.config/agterm/scripts/open-selection.sh"

# ⌘⇧H — показать выделенный иврит/арабский с правильным порядком RTL через
# fribidi (agterm/ghostty не умеет BiDi; выделять в TUI — Shift+drag)
command "Show RTL selection" cmd+shift+h  "$HOME/.config/agterm/scripts/show-rtl.sh"

# ── Русская раскладка (Russian – PC): дубли шорткатов кириллицей ──
# ВАЖНО: `map` держит РОВНО ОДИН чорд на действие — вторая строка с тем же
# действием молча ЗАМЕНЯЕТ первую (так ⌘W однажды перестал закрывать таб:
# `map cmd+ц close_session` снял биндинг с ⌘W и его перехватила macOS как
# «закрыть окно»). Поэтому русские дубли сделаны через `command` +
# socket-команды agtermctl: они ДОБАВЛЯЮТСЯ, не трогая map-биндинги выше.
# Раскладка Russian–PC: `\` не меняется, `/` → `.`, ` ` ` → `ё`.

command "New session here (ru)"  cmd+т  /opt/homebrew/bin/agtermctl session new --cwd "$AGT_SESSION_PWD" --after "$AGT_SESSION_ID" --socket "$AGT_SOCKET"
command "Fork Claude here (ru)"  cmd+и  "$HOME/.config/agterm/scripts/fork-claude.sh"
command "Close session (ru)"     cmd+ц  "$HOME/.config/agterm/scripts/close-session-smart.sh"
command "Next open session (ru)" cmd+shift+ъ  "$HOME/.config/agterm/scripts/go-open.sh" next
command "Prev open session (ru)" cmd+shift+х  "$HOME/.config/agterm/scripts/go-open.sh" prev
command "Focus right pane (ru)"  cmd+ъ  "$HOME/.config/agterm/scripts/focus-or-split-right.sh"
command "Focus left pane (ru)"   cmd+х  /opt/homebrew/bin/agtermctl session focus left --socket "$AGT_SOCKET"
command "Toggle scratch (ru)"    cmd+э  /opt/homebrew/bin/agtermctl session scratch toggle --socket "$AGT_SOCKET"
command "New Claude here (ru)"   cmd+в  "$HOME/.config/agterm/scripts/new-claude.sh"
command "Quick terminal (ru)"    cmd+.  /opt/homebrew/bin/agtermctl quick toggle --socket "$AGT_SOCKET"
command "New session HOME (ru)"  cmd+opt+shift+т  /opt/homebrew/bin/agtermctl session new --socket "$AGT_SOCKET"
command "New workspace (ru)"     cmd+shift+т  /opt/homebrew/bin/agtermctl workspace new --socket "$AGT_SOCKET"
command "Toggle flag (ru)"       cmd+shift+а  /opt/homebrew/bin/agtermctl session flag toggle --socket "$AGT_SOCKET"
command "Search (ru)"            cmd+а  /opt/homebrew/bin/agtermctl session search --socket "$AGT_SOCKET"
command "Dashboard (ru)"         cmd+shift+в  /opt/homebrew/bin/agtermctl dashboard --mru --auto-size --socket "$AGT_SOCKET"
command "Focus/split right"      cmd+]  "$HOME/.config/agterm/scripts/focus-or-split-right.sh"
# ⌘\ — фокус влево + toggle сплита одной клавишей. `\` одинаков в обеих
# раскладках, поэтому русский дубль не нужен.
command "Focus left + toggle split" cmd+\  "$HOME/.config/agterm/scripts/focus-left-toggle-split.sh"

# ⌃⇧] / ⌃⇧[ — переход по сессиям СО СТАТУСОМ агента: active (серый), completed
# (зелёный), blocked (красный). Шире встроенного attention-навига (тот берёт
# только completed+blocked, без серого active). ⇧ добавлен намеренно: ⌃[ в
# терминале — это ESC (vim/readline), ⌃⇧[ его не трогает.
# Русский дубль: `[`→`х`, `]`→`ъ` (Russian–PC).
command "Next status session"      ctrl+shift+]  "$HOME/.config/agterm/scripts/go-status.sh" next
command "Prev status session"      ctrl+shift+[  "$HOME/.config/agterm/scripts/go-status.sh" prev
command "Next status session (ru)" ctrl+shift+ъ  "$HOME/.config/agterm/scripts/go-status.sh" next
command "Prev status session (ru)" ctrl+shift+х  "$HOME/.config/agterm/scripts/go-status.sh" prev
command "Rename session (ru)"    cmd+к  "$HOME/.config/agterm/scripts/rename-session.sh"
command "Open selection (ru)"    cmd+shift+щ  "$HOME/.config/agterm/scripts/open-selection.sh"
command "Show RTL selection (ru)" cmd+shift+р  "$HOME/.config/agterm/scripts/show-rtl.sh"
